<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clay Shop</title>
  <link rel="stylesheet" href="EX4.css">
</head>
<body>
  <div class="page">
    <header>
      <h1>Clay Shop</h1>
      <nav>
        <a href="#">Shop</a>
        <a href="#">About</a>
        <a href="#">Cart (0)</a>
      </nav>
    </header>

    <aside class="filters">
      <h2>Category</h2>
      <ul class="chips">
        <li><button class="chip active">All</button></li>
        <li><button class="chip">Vases</button></li>
        <li><button class="chip">Mugs</button></li>
        <li><button class="chip">Bowls</button></li>
        <li><button class="chip">Plates</button></li>
      </ul>
    </aside>

    <main class="products">
      <div class="toolbar">
        <h2>Handmade ceramics</h2>
        <p>4 items</p>
      </div>

      <ul class="grid">
        <li class="card">
          <div class="thumb" style="background:#2748c9"></div>
          <div class="info">
            <h3>Tall bud vase</h3>
            <p>Matte glaze, 22 cm</p>
            <div class="buy">
              <span class="price">$38</span>
              <button class="btn">Add to cart</button>
            </div>
          </div>
        </li>

        <li class="card">
          <div class="thumb" style="background:#1f8a70"></div>
          <div class="info">
            <h3>Morning mug</h3>
            <p>350 ml, dishwasher safe, comes in a gift box</p>
            <div class="buy">
              <span class="price">$24</span>
              <button class="btn">Add to cart</button>
            </div>
          </div>
        </li>

        <li class="card">
          <div class="thumb" style="background:#c2410c"></div>
          <div class="info">
            <h3>Noodle bowl</h3>
            <p>Deep, speckled white</p>
            <div class="buy">
              <span class="price">$32</span>
              <button class="btn">Add to cart</button>
            </div>
          </div>
        </li>

        <li class="card">
          <div class="thumb" style="background:#6d4fc2"></div>
          <div class="info">
            <h3>Dinner plate</h3>
            <p>27 cm, set of two</p>
            <div class="buy">
              <span class="price">$54</span>
              <button class="btn">Add to cart</button>
            </div>
          </div>
        </li>
      </ul>
    </main>
  </div>
</body>
</html>
